[package]
name = "figcraft-rust-export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FigCraft plugin: export a design as a Rust UI project (Skia / CPU / GPU renderers)"
repository = "https://github.com/storytold/figcraft"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
figcraft-plugin-sdk = { workspace = true }
figcraft-ir = { path = "../crates/figcraft-ir" }
figcraft-import = { path = "../crates/figcraft-import" }
figcraft-emit = { path = "../crates/figcraft-emit" }
figcraft-zip = { path = "../crates/figcraft-zip" }
serde_json = { workspace = true }
